name: benchgate
description: Go benchmark regression gate — collect, compare, and upload results on every PR

inputs:
  pkg:
    description: Package pattern to benchmark
    default: ./...
  bench:
    description: Benchmark regexp
    default: .
  workdir:
    description: Working directory for the candidate checkout
    default: .
  setup:
    description: Setup command run once per worktree before collection
    default: ''
  count:
    description: Number of samples per side
    default: '10'
  benchtime:
    description: Per-iteration time budget
    default: 1s
  cpu:
    description: Optional -cpu value (e.g. 1,2,4)
    default: ''
  runtime-threshold:
    description: Runtime regression threshold percent (sec/op)
    default: '10'
  bytes-threshold:
    description: Bytes regression threshold percent (B/op)
    default: '0'
  allocs-threshold:
    description: Allocs regression threshold percent (allocs/op)
    default: '0'
  cv-threshold:
    description: Max acceptable CV percent
    default: '5'
  alpha:
    description: Significance alpha for Mann-Whitney U test
    default: '0.05'
  min-samples:
    description: Minimum samples per side for a conclusive decision
    default: '10'
  retention-days:
    description: Artifact retention in days
    default: '14'
  go-version:
    description: Go version to set up for both sides
    default: stable

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build benchgate
      shell: bash
      run: |
        cd "${{ github.action_path }}/../../"
        go build -o "$RUNNER_TEMP/benchgate" ./cmd/benchgate

    - name: Derive PR metadata
      shell: bash
      id: pr-meta
      run: |
        # shellcheck source=/dev/null
        event_action=""
        base_sha=""
        head_sha=""
        merge_sha=""
        pr_number=""
        label=""
        actor=""
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          event_action=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
          base_sha=$(jq -r '.pull_request.base.sha // ""' "$GITHUB_EVENT_PATH")
          head_sha=$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")
          merge_sha=$(jq -r '.pull_request.merge_commit_sha // ""' "$GITHUB_EVENT_PATH")
          pr_number=$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")
          label=$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")
          actor=$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")
        fi
        echo "event_action=$event_action" >> "$GITHUB_OUTPUT"
        echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
        echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
        echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
        echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "label=$label" >> "$GITHUB_OUTPUT"
        echo "actor=$actor" >> "$GITHUB_OUTPUT"

    - name: Verify merge SHA
      shell: bash
      env:
        MERGE_SHA: ${{ steps.pr-meta.outputs.merge_sha }}
        HEAD_SHA: ${{ steps.pr-meta.outputs.head_sha }}
      run: |
        if [ -z "$MERGE_SHA" ]; then
          echo "::error::No merge SHA found in event payload. The PR may be closed or the event is not a pull_request event."
          exit 2
        fi
        actual_sha=$(git rev-parse HEAD)
        if [ "$actual_sha" != "$MERGE_SHA" ]; then
          echo "::error::Checkout HEAD ($actual_sha) does not match merge SHA ($MERGE_SHA). The action must run on the merge commit."
          exit 2
        fi
        echo "Verified merge SHA: $MERGE_SHA (head: $HEAD_SHA)"

    - name: Create base worktree
      shell: bash
      id: worktree
      env:
        BASE_SHA: ${{ steps.pr-meta.outputs.base_sha }}
        WORKDIR: ${{ inputs.workdir }}
      run: |
        base_worktree="$RUNNER_TEMP/base-worktree"
        git worktree add --detach "$base_worktree" "$BASE_SHA"
        # Resolve the same relative workdir under the base worktree so both
        # sides benchmark the same package set.
        base_dir="$base_worktree"
        if [ "$WORKDIR" != "." ] && [ -n "$WORKDIR" ]; then
          base_dir="$base_worktree/$WORKDIR"
        fi
        echo "base_dir=$base_dir" >> "$GITHUB_OUTPUT"

    - name: Run benchgate
      shell: bash
      id: benchgate
      env:
        BENCHGATE: ${{ runner.temp }}/benchgate
        BASE_DIR: ${{ steps.worktree.outputs.base_dir }}
        CAND_DIR: ${{ inputs.workdir }}
        PKG: ${{ inputs.pkg }}
        BENCH: ${{ inputs.bench }}
        COUNT: ${{ inputs.count }}
        BENCHTIME: ${{ inputs.benchtime }}
        CPU: ${{ inputs.cpu }}
        SETUP: ${{ inputs.setup }}
        RUNTIME_THRESHOLD: ${{ inputs.runtime-threshold }}
        BYTES_THRESHOLD: ${{ inputs.bytes-threshold }}
        ALLOCS_THRESHOLD: ${{ inputs.allocs-threshold }}
        CV_THRESHOLD: ${{ inputs.cv-threshold }}
        ALPHA: ${{ inputs.alpha }}
        MIN_SAMPLES: ${{ inputs.min-samples }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ steps.pr-meta.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr-meta.outputs.head_sha }}
        MERGE_SHA: ${{ steps.pr-meta.outputs.merge_sha }}
        PR_NUMBER: ${{ steps.pr-meta.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        ATTEMPT: ${{ github.run_attempt }}
        EVENT_ACTION: ${{ steps.pr-meta.outputs.event_action }}
        LABEL: ${{ steps.pr-meta.outputs.label }}
        ACTOR: ${{ steps.pr-meta.outputs.actor }}
      run: |
        # shellcheck disable=SC2086
        waiver_args=""
        if [ "$LABEL" = "benchgate:accept-regression" ] && [ "$EVENT_ACTION" = "labeled" ]; then
          waiver_args="-waiver-enabled -waiver-actor $ACTOR -waiver-head-sha $HEAD_SHA"
        fi

        cpu_args=""
        if [ -n "$CPU" ]; then
          cpu_args="-cpu $CPU"
        fi
        setup_args=""
        if [ -n "$SETUP" ]; then
          setup_args="-setup $SETUP"
        fi

        "$BENCHGATE" run \
          -base-dir "$BASE_DIR" \
          -cand-dir "$CAND_DIR" \
          -pkg "$PKG" \
          -bench "$BENCH" \
          -count "$COUNT" \
          -benchtime "$BENCHTIME" \
          -work-dir "$RUNNER_TEMP" \
          $cpu_args \
          $setup_args \
          -runtime-threshold "$RUNTIME_THRESHOLD" \
          -bytes-threshold "$BYTES_THRESHOLD" \
          -allocs-threshold "$ALLOCS_THRESHOLD" \
          -cv-threshold "$CV_THRESHOLD" \
          -alpha "$ALPHA" \
          -min-samples "$MIN_SAMPLES" \
          -repo "$REPO" \
          -base-sha "$BASE_SHA" \
          -head-sha "$HEAD_SHA" \
          -merge-sha "$MERGE_SHA" \
          -pr "$PR_NUMBER" \
          -run-id "$RUN_ID" \
          -attempt "$ATTEMPT" \
          -json-out "$RUNNER_TEMP/report.json" \
          -markdown-out "$RUNNER_TEMP/report.md" \
          $waiver_args \
          2>&1 | tee "$RUNNER_TEMP/benchgate-output.txt"
        benchgate_exit=${PIPESTATUS[0]}
        echo "exit_code=$benchgate_exit" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Append job summary
      if: always()
      shell: bash
      env:
        GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        if [ -f "$RUNNER_TEMP/report.md" ]; then
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
        elif [ -f "$RUNNER_TEMP/benchgate-output.txt" ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/benchgate-output.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchgate-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/base.txt
          ${{ runner.temp }}/candidate.txt
          ${{ runner.temp }}/report.json
          ${{ runner.temp }}/report.md
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Return exit code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.benchgate.outputs.exit_code }}
      run: |
        exit "$EXIT_CODE"
